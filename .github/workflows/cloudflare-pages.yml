name: Validate and publish Barefoot Opiniones
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barefoot-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/verify-release.test.mjs
      - run: npm run build
      - run: npm run check:schema
      - run: npm run check:site
      - name: Stamp the built revision
        run: node scripts/verify-release.mjs stamp
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: dist/
      - name: Require durable deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN with Pages Edit for the existing HSU Cloudflare account.'
            exit 1
          fi
      - name: Publish the existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 905ffd22734f2d0ef6319dd1fd356e2d
        run: npx --yes wrangler@4.151.0 pages deploy dist --project-name barefootopiniones-com --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify the exact revision on production
        run: node scripts/verify-release.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: release-verification.json
          if-no-files-found: ignore
          retention-days: 30
